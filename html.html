<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Сканер штрихкодов</title>
<style>
  :root {
    --bg: #0d1014; --panel: #171b21; --text: #e9edf2; --muted: #8a94a3;
    --ok: #3ddc97; --err: #ff6b6b; --line: #2a303a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  #viewport { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
  #reader { width: 100%; height: 100%; }
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  #reader img, #reader canvas { display: none !important; }

  .frame { position: absolute; left: 50%; top: 50%; width: min(78vw, 360px); height: 34vw; min-height: 120px; max-height: 190px;
    transform: translate(-50%, -50%); pointer-events: none; border-radius: 6px;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
  .frame i { position: absolute; width: 26px; height: 26px; border: 3px solid #fff; transition: border-color .2s; }
  .frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
  .frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
  .frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
  .frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }
  body.ok .frame i { border-color: var(--ok); }
  body.err .frame i { border-color: var(--err); }

  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: var(--bg); text-align: center; padding: 24px; z-index: 5; }
  #start p { margin: 0; color: var(--muted); max-width: 28ch; }
  #start.hidden { display: none; }

  .bar { background: var(--panel); border-top: 1px solid var(--line); padding: 14px 16px 16px; }
  #status { min-height: 1.4em; margin: 0 0 12px; text-align: center; font-size: 17px; font-weight: 600; }
  body.ok #status { color: var(--ok); }
  body.err #status { color: var(--err); }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 14px 12px; border-radius: 12px; border: 1px solid var(--line); background: #222831;
    color: var(--text); font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
  .btn:active { background: #2b323d; }
  .btn.primary { background: #fff; color: #0d1014; border-color: #fff; }
  .btn:focus-visible { outline: 3px solid #7cb8ff; outline-offset: 2px; }
</style>
</head>
<body>
  <div id="viewport">
    <div id="reader"></div>
    <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="start">
      <p>Камера нужна, чтобы считывать штрихкоды товаров.</p>
      <button id="startBtn" class="btn primary" style="flex:none;min-width:220px">Включить камеру</button>
    </div>
  </div>

  <div class="bar">
    <p id="status" role="status" aria-live="polite">Загрузка…</p>
    <div class="row">
      <button id="switchBtn" class="btn" type="button">Сменить камеру</button>
      <a id="backBtn" class="btn" href="#">Вернуться в Telegram</a>
    </div>
  </div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(() => {
  // ====== НАСТРОЙКИ ======
  const OK_RESUME_MS = 2000;
  const ERR_RESUME_MS = 3000;
  const REQUEST_TIMEOUT_MS = 8000;

  // ====== ПАРАМЕТРЫ ИЗ URL ======
  const q = new URLSearchParams(location.search);
  const userId = q.get("user_id");
  const apiUrl = q.get("api_url");
  const sig = q.get("sig") || "";

  const rawBotLink = q.get("bot_link") || "";
  const botLink = /^https:\/\/(t\.me|telegram\.me)\/[A-Za-z0-9_]{3,}([\/?#].*)?$/i.test(rawBotLink)
    ? rawBotLink
    : "https://t.me";

  const tg = window.Telegram && window.Telegram.WebApp;
  const inMiniApp = !!(tg && tg.platform && tg.platform !== "unknown");
  if (tg) { try { tg.ready(); tg.expand(); } catch (_) {} }

  const $ = id => document.getElementById(id);
  const statusEl = $("status");

  // ====== КНОПКА "ВЕРНУТЬСЯ" (ЗАКРЫВАЕТ СКАНЕР) ======
  $("backBtn").href = botLink;
  $("backBtn").addEventListener("click", (e) => {
    // Если это Mini App — закрываем его
    if (inMiniApp) {
      e.preventDefault();
      try { tg.close(); } catch (_) { location.href = botLink; }
    }
    // Если обычный браузер — переходим по ссылке (страница выгружается)
    // href уже установлен, так что просто даем браузеру перейти
  });

  function setStatus(text, kind) {
    statusEl.textContent = text;
    document.body.classList.remove("ok", "err");
    if (kind) document.body.classList.add(kind);
  }

  let linkError = null;
  if (!userId || !apiUrl) linkError = "Ссылка неполная. Откройте сканер заново из бота.";
  else if (!/^https:\/\//i.test(apiUrl)) linkError = "api_url должен начинаться с https://";
  if (linkError) {
    setStatus("❌ " + linkError, "err");
    $("startBtn").disabled = true;
    return;
  }
  setStatus("Нажмите «Включить камеру»");

  let audioCtx = null;
  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (_) {}
  }
  function beep(freq = 1050, ms = 130) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + ms / 1000);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + ms / 1000 + 0.02);
  }

  const F = Html5QrcodeSupportedFormats;
  const scanner = new Html5Qrcode("reader", {
    formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  let facing = "environment";
  let busy = false;
  let running = false;

  const config = {
    fps: 12,
    qrbox: (w, h) => ({ width: Math.floor(w * 0.8), height: Math.floor(Math.min(h * 0.4, w * 0.45)) }),
    disableFlip: true
  };

  function videoEl() { return document.querySelector("#reader video"); }
  function streamAlive() {
    const v = videoEl();
    const track = v && v.srcObject && v.srcObject.getVideoTracks()[0];
    return !!track && track.readyState === "live";
  }

  async function startCamera() {
    try {
      if (running) { await scanner.stop(); running = false; }
      await scanner.start({ facingMode: facing }, config, onScan, () => {});
      running = true;
      busy = false;
      setStatus("Наведите камеру на штрихкод");
    } catch (e) {
      running = false;
      const denied = /permission|denied|notallowed/i.test(String(e));
      setStatus(denied ? "❌ Нет доступа к камере. Разрешите её в настройках браузера."
                       : "❌ Не удалось включить камеру", "err");
    }
  }

  async function onScan(code) {
    if (busy) return;
    busy = true;
    try { scanner.pause(true); } catch (_) {}
    beep();
    if (navigator.vibrate) navigator.vibrate(60);
    setStatus(`Код: ${code}. Отправка...`);

    let ok = false, msg = "❌ Ошибка отправки";
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
    try {
      const res = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" },
        body: JSON.stringify({ code: String(code), user_id: String(userId), sig }),
        signal: ctrl.signal
      });
      if (res.ok) {
        ok = true;
        msg = "✅ Товар добавлен!";
      } else if (res.status === 403) {
        msg = "❌ Ссылка недействительна. Откройте сканер заново из бота.";
      } else {
        let d = null;
        try { d = (await res.json()).detail; } catch (_) {}
        if (typeof d === "string" && d) msg = "❌ " + d;
      }
    } catch (_) {
    } finally {
      clearTimeout(timer);
    }

    if (!ok) beep(300, 260);
    setStatus(msg, ok ? "ok" : "err");
    setTimeout(async () => {
      if (streamAlive()) {
        try { scanner.resume(); } catch (_) {}
        busy = false;
        setStatus("Наведите камеру на штрихкод");
      } else {
        await startCamera();
      }
    }, ok ? OK_RESUME_MS : ERR_RESUME_MS);
  }

  $("startBtn").addEventListener("click", async () => {
    unlockAudio();
    $("start").classList.add("hidden");
    setStatus("Запуск камеры…");
    await startCamera();
  });

  $("switchBtn").addEventListener("click", async () => {
    unlockAudio();
    if (busy) return;
    facing = facing === "environment" ? "user" : "environment";
    setStatus("Переключение камеры…");
    await startCamera();
  });

  document.addEventListener("visibilitychange", async () => {
    if (document.hidden || !running) return;
    if (streamAlive()) {
      if (busy) return;
      try { scanner.resume(); } catch (_) {}
      const v = videoEl();
      if (v && v.paused) v.play().catch(() => {});
    } else {
      await startCamera();
    }
  });
})();
</script>
</body>
</html>
